services:

  api:
    depends_on:
      db-test:
        condition: service_healthy
    command:
      sh -c "npm run test:e2e"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      DB_HOST: db-test
      TEST_DB_HOST: db-test
      TEST_DB_PORT: 5432
      TEST_DB_USERNAME: ${TEST_DB_USERNAME:-seed_test}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:-seed_test}
      TEST_DB_NAME: ${TEST_DB_NAME:-seed_test}
      SWAPI_BASE_URL: ${SWAPI_BASE_URL}
      DB_SYNCHRONIZE: "true"
  # Base descartable para los tests e2e: guarda los datos en memoria (tmpfs)
  db-test:
    image: postgres:16-alpine
    container_name: seed-db-test
    environment:
      POSTGRES_USER: ${TEST_DB_USERNAME:-seed_test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-seed_test}
      POSTGRES_DB: ${TEST_DB_NAME:-seed_test}
    ports:
      - '${TEST_DB_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${TEST_DB_USERNAME:-seed_test} -d ${TEST_DB_NAME:-seed_test}',
        ]
      interval: 2s
      timeout: 5s
      retries: 15
