version: 2.1

orbs:
  node: circleci/node@5.0.2

jobs:
  build_and_test:
    docker:
      - image: circleci/postgres:16.4-alpine
        environment:
          POSTGRES_USER: seed_test
          POSTGRES_PASSWORD: poné-una-clave
          POSTGRES_DB: seed_test
          POSTGRES_PORT: 5432
        ports:
          - 5432:5432
        volumes:
          - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
    executor:
      name: node/default
      tag: "24.22"
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run tests
          command: npm run test:e2e
      - run:
          name: Build app
          command: npm run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

workflows:
  build_test_deploy:
    jobs:
      - build_and_test
