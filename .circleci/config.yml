version: 2.1

orbs:
  node: circleci/node@5.0.2

jobs:
  build_and_test:
    executor:
      name: node/default
      tag: "24.22"
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run tests
          command: npm run test
      - run:
          name: Build app
          command: npm run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

workflows:
  build_test_deploy:
    jobs:
      - build_and_test
