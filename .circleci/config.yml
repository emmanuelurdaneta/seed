version: 2.1

orbs:
  node: circleci/node@5.0.2
  coveralls: coveralls/coveralls@2.2.5

jobs:
  build_and_test:
    docker:
      - image: cimg/node:24.22
        environment:
          NODE_ENV: development
          DB_HOST: localhost
          DB_SYNCHRONIZE: "true"
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USERNAME: seed_test
          TEST_DB_PASSWORD: seed_test
          TEST_DB_NAME: seed_test
          SWAPI_BASE_URL: https://swapi.dev/api
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: seed_test
          POSTGRES_PASSWORD: seed_test
          POSTGRES_DB: seed_test
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Wait for Postgres
          command: |
            for i in $(seq 1 30); do
              nc -z localhost 5432 && echo "Postgres is ready" && exit 0
              sleep 1
            done
            echo "Postgres did not become ready in time"
            exit 1
      - run:
          name: Run tests with coverage
          command: npm run test:e2e -- --coverage
      - run:
          name: Build app
          command: npm run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - .
      - coveralls/upload:
          flag_name: Test 1
          verbose: true
workflows:
  build_test_deploy:
    jobs:
      - build_and_test
